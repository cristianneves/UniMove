services:
  postgres:
    image: postgres:16-alpine
    container_name: unimove-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: unimove
      POSTGRES_USER: unimove
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - unimove_pgdata_prod:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimove -d unimove"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unimove-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/unimove
      DATABASE_USER: unimove
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  unimove_pgdata_prod:
