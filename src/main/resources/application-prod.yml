# Perfil de producao (SPRING_PROFILES_ACTIVE=prod).
#
# Existe sobretudo para impedir que producao suba com os defaults de
# desenvolvimento do application.yml:
#
#   JWT_SECRET        -> "dev-secret-NAO-USE-EM-PRODUCAO-..."  (48 chars: chave HMAC VALIDA!)
#   DATABASE_PASSWORD -> "changeme"
#
# Sem as redeclaracoes abaixo, esquecer a env var nao quebraria nada: a API
# subiria feliz assinando JWT com um segredo que esta neste repositorio.
#
# A guarda PRINCIPAL e o `${VAR:?mensagem}` do docker-compose.prod.yml, que
# recusa subir a stack com mensagem clara antes de criar qualquer container.
# As linhas aqui sao a segunda camada, para quem rodar o jar fora do compose:
# o Binder do Spring Boot nao explode em placeholder nao resolvido — ele passa
# o texto literal "${JWT_SECRET}" adiante. O startup aborta mesmo assim
# (o JJWT rejeita os 13 bytes como chave HMAC fraca; o Postgres recusa a senha
# literal), so que com erro menos obvio. O que importa e que aborta em vez de
# usar o segredo de desenvolvimento.
spring:
  datasource:
    password: ${DATABASE_PASSWORD}
  # SSE (mural, chat, status da corrida) segura conexoes abertas por minutos.
  # O shutdown gracioso deixa as requisicoes em voo terminarem e corta os
  # streams no timeout, em vez de derrubar tudo no SIGTERM do deploy.
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET}
